name: tests

# SCRATCH, never to merge (Huly QB-1246 with QB-1248): this branch replaces qbm-http's tests workflow with ONE job on
# the macOS image, which measures what the Mac's TSan leg reported on 2026-11-13: `http2-client-coro` does not link
# under TSan (AppleClang), « a duplicate thread-local wrapper of qb::io::async::listener::current, between the
# library's client.cpp and the test's TU ». It builds the qbm-http superbuild against isndev/qb at a ref, under
# QB_SANITIZE=thread, links that target with ninja -v, prints the Mach-O symbols each object carries for
# listener::current (nm -m), and builds two controls: another HTTP/2 system test of the module, and qb's own
# listener-after-loop test.
#
# Lot T7-TLW adds two steps: a census of the wrapper's linkage in EVERY object and archive member the build produced
# (a strong `external` definition is the defect; a census that finds no carrier is vacuous and reads red), and a
# verdict that fails the job on any duplicate-symbol line in a link log, any strong wrapper, any target that did not
# link and any target that did not run to exit 0.

on:
  workflow_dispatch:
    inputs:
      qb_ref:
        description: "the isndev/qb ref to build against"
        required: false
        default: int/340-t7
      build_type:
        description: "CMAKE_BUILD_TYPE"
        required: false
        default: RelWithDebInfo
      targets:
        description: "the targets to link, then run (space-separated)"
        required: false
        default: "qbm-http-test-system-http2-client-coro qbm-http-test-system-http2-client qb-io-test-unit-listener-after-loop"
      sanitize:
        description: "QB_SANITIZE (empty: none)"
        required: false
        default: thread
      ir:
        description: "source paths (suffixes) whose LLVM IR to emit, for the TLS wrapper's linkage (space-separated)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos-tsan:
    name: macos-tsan-link-oracle
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: module
      - uses: actions/checkout@v6
        with:
          repository: isndev/qb
          ref: ${{ inputs.qb_ref || 'int/340-t7' }}
          path: qb

      - name: Install dependencies as qb's macOS lane does
        run: ./qb/scripts/ci-install-macos-dependencies.sh --profile build

      - name: Configure (TSan)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oracle"
          { sw_vers; clang++ --version; xcrun --find ld; ld -v 2>&1 || true; git -C qb rev-parse HEAD; git -C module rev-parse HEAD; } \
            | tee "${RUNNER_TEMP}/oracle/host.txt"
          cmake -S module/.github/ci/superbuild -B build -G Ninja \
                -DCMAKE_BUILD_TYPE="${{ inputs.build_type || 'RelWithDebInfo' }}" -DQB_CXX_STANDARD=20 \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DQB_SANITIZE="${{ inputs.sanitize }}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DQB_WITH_SSL=ON -DQB_USE_SYSTEM_GTEST=ON -DQB_ENABLE_NATIVE_ARCH=OFF \
                -DOPENSSL_EXECUTABLE="${OPENSSL_EXECUTABLE}" \
                -DQBM_CI_QB_DIR="${GITHUB_WORKSPACE}/qb" -DQBM_CI_MODULE_DIR="${GITHUB_WORKSPACE}/module" \
                2>&1 | tee "${RUNNER_TEMP}/oracle/configure.log"

      - name: Link the reported target, and the two controls
        run: |
          set -uo pipefail
          set +e  # the step shell is `bash -e`: a target that fails to link must not stop the others
          o="${RUNNER_TEMP}/oracle"
          for t in ${{ inputs.targets }}; do
            ninja -C build -v "$t" > "$o/build-$t.log" 2>&1; rc=$?
            echo "$t: ninja exit $rc" | tee -a "$o/verdicts.txt"
            grep -nE "duplicate symbol|ld: |error:|warning: .*thread|Undefined" "$o/build-$t.log" | head -40 || true
          done

      - name: The symbols each object carries for listener::current
        run: |
          set -uo pipefail
          o="${RUNNER_TEMP}/oracle"
          {
            for f in $(find build -name '*.o' \( -path '*http2-client-coro*' -o -path '*qbm*http*2*client.cpp.o' -o -path '*http2-client.cpp.o' -o -path '*listener-after-loop*' -o -path '*close-after-peer-alloc*' -o -name 'listener.cpp.o' \) | sort); do
              echo "== $f"; nm -m "$f" 2>/dev/null | grep -E 'listener7current|_ZTW|_ZTH' | head -30
            done
            for a in $(find build -name 'libqbm-http*.a' -o -name 'libqb-io*.a' | sort); do
              echo "== $a"; nm -m "$a" 2>/dev/null | grep -E 'listener7current' | sort | uniq -c | head -30
            done
          } | tee "$o/symbols.txt"

      - name: Census -- the linkage of listener::current's thread wrapper in every object and archive member
        run: |
          set -uo pipefail
          python3 - "${RUNNER_TEMP}/oracle" <<'PY'
          import collections, pathlib, re, subprocess, sys
          out_dir = pathlib.Path(sys.argv[1])
          W = "__ZTWN2qb2io5async8listener7currentE"
          row = re.compile(r"^\s*(?:[0-9a-fA-F]+\s+)?\(([^)]*)\)\s+(.*?)\s+" + re.escape(W) + r"$")
          head = re.compile(r"^(.*\((.+\.o)\)):$")

          def carriers(path):
              text = subprocess.run(["nm", "-m", str(path)], capture_output=True, text=True).stdout
              member, found = str(path), collections.defaultdict(set)
              for line in text.splitlines():
                  h = head.match(line)
                  if h:
                      member = h.group(1)
                      continue
                  m = row.match(line)
                  if m and m.group(1) != "undefined":
                      found[member].add(m.group(2))
              return found

          tally, strong, lines = collections.Counter(), [], []
          objects = sorted(pathlib.Path("build").rglob("*.o"))
          archives = sorted(p for p in pathlib.Path("build").rglob("*.a") if p.is_file())
          for path in objects + archives:
              for member, kinds in sorted(carriers(path).items()):
                  for kind in sorted(kinds):
                      where = "archive" if path.suffix == ".a" else "object"
                      tally[(where, kind)] += 1
                      lines.append(f"{where:7s} {kind:24s} {member}")
                      if "weak" not in kind.split() and kind != "non-external":  # external, private external
                          strong.append(f"{where} {kind} {member}")
          report = [f"scanned: {len(objects)} objects, {len(archives)} archives"]
          report += [f"  {w:7s} {k:24s} x{n}" for (w, k), n in sorted(tally.items())]
          report += ["STRONG (defined, not weak, not non-external):"] + [f"  {s}" for s in strong]
          carrying = sum(n for (w, _), n in tally.items() if w == "object")
          report.append(f"census: carriers={carrying} strong={len(strong)}")
          if carrying == 0:
              report.append("census: VACUOUS -- no object defines the wrapper; the census proves nothing")
          (out_dir / "census.txt").write_text("\n".join(report + ["", "every carrier:"] + lines) + "\n")
          with open(out_dir / "verdicts.txt", "a") as v:
              v.write(f"census: carriers={carrying} strong={len(strong)}\n")
          print("\n".join(report))
          PY

      - name: The IR of the named sources, for listener::current's TLS wrapper
        if: inputs.ir != ''
        run: |
          set -uo pipefail
          o="${RUNNER_TEMP}/oracle"
          for src in ${{ inputs.ir }}; do
            python3 - "$src" "$o" <<'PY'
          import json, os, re, shlex, subprocess, sys
          suffix, out = sys.argv[1], sys.argv[2]
          db = json.load(open("build/compile_commands.json"))
          hits = [e for e in db if e["file"].endswith(suffix)]
          print(f"== {suffix}: {len(hits)} entr(y/ies)")
          for e in hits[:2]:
              args = shlex.split(e["command"]) if "command" in e else e["arguments"]
              a, skip = [], False
              for x in args:
                  if skip: skip = False; continue
                  if x in ("-o", "-MF", "-MT", "-MQ"): skip = True; continue
                  if x in ("-c", "-MD", "-MMD"): continue
                  a.append(x)
              name = re.sub(r"[^A-Za-z0-9]+", "_", e["file"])[-80:]
              ll = os.path.join(out, name + ".ll")
              r = subprocess.run(a + ["-S", "-emit-llvm", "-o", ll], cwd=e["directory"], capture_output=True, text=True)
              print("  rc", r.returncode, r.stderr[-400:])
              if r.returncode: continue
              text = open(ll).read().splitlines()
              for line in text:
                  if "_ZTWN2qb2io5async8listener7currentE" in line and (line.startswith("define") or line.startswith("declare") or line.startswith("@")):
                      print("  ", line[:220])
              # the functions that call the wrapper, first ten
              cur, users = None, []
              for line in text:
                  if line.startswith("define"):
                      cur = line
                  elif cur and "@_ZTWN2qb2io5async8listener7currentE" in line and cur not in users:
                      users.append(cur)
              print("  callers:", len(users))
              for u in users[:10]:
                  print("    ", u[:200])
          PY
          done 2>&1 | tee "$o/ir.txt"

      - name: Run what linked
        if: always()
        run: |
          set -uo pipefail
          set +e  # the step shell is `bash -e`: a test that fails must not stop the others
          o="${RUNNER_TEMP}/oracle"
          for t in ${{ inputs.targets }}; do
            b="$(find build -type f -perm -u+x -name "$t" | head -1)"
            if [ -n "$b" ]; then (cd "$(dirname "$b")" && TSAN_OPTIONS=halt_on_error=1 perl -e 'alarm shift; exec @ARGV' 300 "./$t" --gtest_brief=1) > "$o/run-$t.log" 2>&1; echo "$t: run exit $?" | tee -a "$o/verdicts.txt"; tail -5 "$o/run-$t.log"; else echo "$t: no binary" | tee -a "$o/verdicts.txt"; fi
          done

      - name: Verdict -- red on a duplicate symbol, a strong wrapper, a target that did not link or did not run clean
        if: always()
        run: |
          set -uo pipefail
          o="${RUNNER_TEMP}/oracle"
          red=0
          dup="$(cat "$o"/build-*.log 2>/dev/null | grep -c "duplicate symbol" || true)"
          echo "duplicate-symbol lines in the link logs: ${dup:-0}"
          [ "${dup:-0}" -eq 0 ] || red=1
          grep -E "census: carriers=" "$o/verdicts.txt" || { echo "no census line"; red=1; }
          if grep -qE "census: carriers=0 " "$o/verdicts.txt"; then echo "census vacuous"; red=1; fi
          if grep -E "census: .* strong=[1-9]" "$o/verdicts.txt"; then red=1; fi
          for t in ${{ inputs.targets }}; do
            grep -qxF "$t: ninja exit 0" "$o/verdicts.txt" || { echo "$t: did not link"; red=1; }
            grep -qxF "$t: run exit 0" "$o/verdicts.txt" || { echo "$t: did not run to exit 0"; red=1; }
          done
          if [ "$red" -eq 0 ]; then echo "VERDICT: GREEN" | tee -a "$o/verdicts.txt"; else echo "VERDICT: RED" | tee -a "$o/verdicts.txt"; fi
          exit "$red"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-tsan-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle
          retention-days: 14
