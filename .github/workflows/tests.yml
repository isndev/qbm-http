name: tests

# SCRATCH, never to merge (lot T7-H2MAC, Huly QB-1270): this branch replaces qbm-http's tests workflow with ONE job on
# the macOS image, run once per OpenSSL major (Homebrew openssl@4 -- the lane's -- and openssl@3): it builds the
# qbm-http superbuild against isndev/qb at a ref and runs http2-control-replies' flood case repeatedly, the test and the
# HTTP/2 session instrumented ([H2MAC] lines: what the server's session and the client met, per flood), then counts
# the floods per verdict.

on:
  workflow_dispatch:
    inputs:
      qb_ref:
        description: "the isndev/qb ref to build against"
        required: false
        default: 3cf68f94142b2edb033cfd4a5a9f094ac803a6df
      build_type:
        description: "CMAKE_BUILD_TYPE"
        required: false
        default: Release
      majors:
        description: "the OpenSSL majors, a JSON list"
        required: false
        default: '["4", "3"]'
      filter:
        description: "the gtest filter"
        required: false
        default: "Http2ControlRepliesWireTest.AClientThatNeverReads*"
      repeat:
        description: "--gtest_repeat"
        required: false
        default: "20"
      sanitize:
        description: "QB_SANITIZE (none: no sanitizer)"
        required: false
        default: none
      extra:
        description: "extra arguments to the test binary"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  macos:
    name: macos-h2mac-openssl${{ matrix.major }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJSON(inputs.majors) }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: module
      - uses: actions/checkout@v6
        with:
          repository: isndev/qb
          ref: ${{ inputs.qb_ref }}
          path: qb

      - name: Install dependencies as qb's macOS lane does, and openssl@3 beside openssl@4
        run: |
          ./qb/scripts/ci-install-macos-dependencies.sh --profile build
          brew list --versions openssl@3 openssl@4 || brew install openssl@3 openssl@4
          brew list --versions openssl@3 openssl@4

      - name: The machine
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/oracle"
          {
            sw_vers; uname -a; sysctl -n machdep.cpu.brand_string hw.logicalcpu hw.memsize
            sysctl kern.ipc.maxsockbuf kern.ipc.somaxconn kern.ipc.nmbclusters net.inet.tcp.sendspace net.inet.tcp.recvspace \
                   net.inet.tcp.autorcvbufmax net.inet.tcp.autosndbufmax net.inet.tcp.doautorcvbuf net.inet.tcp.doautosndbuf \
                   net.inet.tcp.autosndbufinc net.inet.tcp.mssdflt 2>&1
            netstat -m 2>&1 | head -20
            clang++ --version | head -1
            for v in 3 4; do "$(brew --prefix openssl@$v)/bin/openssl" version; done
            git -C qb rev-parse HEAD; git -C module rev-parse HEAD
          } 2>&1 | tee "${RUNNER_TEMP}/oracle/host.txt"
          true

      - name: Configure and build against openssl@${{ matrix.major }}
        run: |
          set -euo pipefail
          p="$(brew --prefix openssl@${{ matrix.major }})"
          san="${{ inputs.sanitize }}"; [ "$san" = none ] && san=""
          # The lane's own environment names openssl@4 (CMAKE_PREFIX_PATH, PKG_CONFIG_PATH): this build names its own, alone.
          env -u CMAKE_PREFIX_PATH -u PKG_CONFIG_PATH -u OPENSSL_EXECUTABLE PKG_CONFIG_PATH="$p/lib/pkgconfig" \
            cmake -S module/.github/ci/superbuild -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" -DQB_CXX_STANDARD=20 \
                  -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DQB_SANITIZE="$san" \
                  -DQB_WITH_SSL=ON -DQB_WITH_QUIC=OFF -DQB_USE_SYSTEM_GTEST=ON -DQB_ENABLE_NATIVE_ARCH=OFF \
                  -DOPENSSL_ROOT_DIR="$p" -DOPENSSL_EXECUTABLE="$p/bin/openssl" \
                  -DCMAKE_PREFIX_PATH="$p;$(brew --prefix);$(brew --prefix zlib)" \
                  -DQBM_CI_QB_DIR="${GITHUB_WORKSPACE}/qb" -DQBM_CI_MODULE_DIR="${GITHUB_WORKSPACE}/module" \
                  > "${RUNNER_TEMP}/oracle/configure.log" 2>&1 || { tail -40 "${RUNNER_TEMP}/oracle/configure.log"; exit 1; }
          grep -E 'Found OpenSSL|OpenSSL:' "${RUNNER_TEMP}/oracle/configure.log" || true
          ninja -C build qbm-http-test-system-http2-control-replies > "${RUNNER_TEMP}/oracle/build.log" 2>&1 \
            || { grep -E 'error|FAILED' "${RUNNER_TEMP}/oracle/build.log" | head -60; exit 1; }
          echo "warnings: $(grep -c 'warning:' "${RUNNER_TEMP}/oracle/build.log" || true)"
          b="$(find build -type f -perm -u+x -name qbm-http-test-system-http2-control-replies | head -1)"
          otool -L "$b" | grep -iE 'ssl|crypto'

      - name: Run the flood case
        run: |
          set -uo pipefail
          set +e  # the step shell is `bash -e`: a red test must not stop the counting
          o="${RUNNER_TEMP}/oracle"
          b="$(find build -type f -perm -u+x -name qbm-http-test-system-http2-control-replies | head -1)"
          (cd "$(dirname "$b")" && TSAN_OPTIONS=halt_on_error=1 perl -e 'alarm shift; exec @ARGV' 1200 \
             ./qbm-http-test-system-http2-control-replies --gtest_color=no --gtest_filter="${{ inputs.filter }}" \
             --gtest_repeat=${{ inputs.repeat }} ${{ inputs.extra }}) > "$o/run.log" 2>&1
          echo "run exit $?" | tee "$o/verdict.txt"
          grep -c '^\[       OK \]' "$o/run.log" | sed 's/^/OK cases: /'
          grep -c '^\[  FAILED  \] [A-Za-z]' "$o/run.log" | sed 's/^/FAILED cases (with the summary lines): /'
          python3 - "$o/run.log" <<'PY' | tee -a "$o/verdict.txt"
          import collections, re, sys
          text = open(sys.argv[1], errors="replace").read().splitlines()
          per = collections.Counter(); late = collections.Counter(); shapes = collections.Counter()
          for line in text:
              m = re.match(r"\[H2MAC\] RESULT flood=(.*?) verdict=(\w+) (.*)", line)
              if not m:
                  continue
              flood, verdict, rest = m.groups()
              per[(flood, verdict)] += 1
              kv = dict(re.findall(r"(\w+)=(\{[^}]*\}|\S+)", rest))
              shapes[(flood, verdict, kv.get("held10"), kv.get("late"), kv.get("write_fail_errno"), kv.get("read_fail_errno"), kv.get("server_ok"))] += 1
          for (flood, verdict), n in sorted(per.items()):
              print(f"flood {flood!r}: {verdict} x{n}")
          print("shapes (flood, verdict, held10, late, client write errno, client read errno, server_ok):")
          for k, n in sorted(shapes.items(), key=lambda kv: (-kv[1], kv[0])):
              print(f"  {n:3d} {k}")
          PY
          grep -E '^\[H2MAC\] RESULT' "$o/run.log" | head -80
          echo "--- the first failing flood, whole"
          awk '/^\[H2MAC\] =====/{buf=""} /^\[H2MAC\]/{buf=buf $0 "\n"} /^\[H2MAC\] RESULT .*verdict=FAIL/{print buf; exit}' "$o/run.log" | cut -c1-600
          echo "--- the first passing flood, whole"
          awk '/^\[H2MAC\] =====/{buf=""} /^\[H2MAC\]/{buf=buf $0 "\n"} /^\[H2MAC\] RESULT .*verdict=PASS/{print buf; exit}' "$o/run.log" | cut -c1-600

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-h2mac-openssl${{ matrix.major }}-${{ github.run_id }}
          path: ${{ runner.temp }}/oracle
          retention-days: 14
